name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # The annotations artifact ships iosArm64/iosSimulatorArm64 klibs, so the
    # runner needs a macOS host with Kotlin/Native support.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-$TAG_NAME}"
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Could not determine a version from the tag or workflow input" >&2
            exit 1
          fi
          echo "Publishing version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --configure-on-demand keeps the Android/Compose sample modules out of the
      # build: they are not published here, and the sample consumes the plugin
      # from mavenLocal, which is empty on a fresh runner.
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon --configure-on-demand --no-configuration-cache \
            -PswiftCodegenVersion="${{ steps.version.outputs.version }}" \
            :swift-codegen:publishAllPublicationsToGitHubPackagesRepository \
            :swift_codegen_annotations:publishAllPublicationsToGitHubPackagesRepository \
            :swift_codegen_gradle_plugin:publishAllPublicationsToGitHubPackagesRepository
