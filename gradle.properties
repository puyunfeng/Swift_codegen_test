#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Publishing
# The version of the published swift codegen artifacts. The plugin reads the
# same value at runtime, so bumping this single property is enough.
# CI overrides it with -PswiftCodegenVersion=<tag>.
swiftCodegenVersion=1.0.0
